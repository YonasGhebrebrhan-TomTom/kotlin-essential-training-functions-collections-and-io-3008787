name: Build and Test

on:
  push:
    branches:
      - main
      - "lesson/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Must match jvmToolchain(21) in project/build.gradle.kts. If it doesn't,
      # Gradle downloads a second JDK via the foojay resolver and the build still
      # passes -- slower, and the mismatch is invisible.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
        working-directory: project

      - name: Build
        run: ./gradlew build --no-daemon
        working-directory: project

      - name: Test
        run: ./gradlew test --no-daemon
        working-directory: project
